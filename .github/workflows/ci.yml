# ci.yml —— 静态检查：Python 语法、Shell 语法、ShellCheck、SKILL.md frontmatter
# 不做端到端烧录：跑通需要下载约 3GB 的 ggml 模型，不适合放进 CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 语法检查
        run: python3 -m py_compile scripts/srt_to_ass.py

      - name: Shell 语法检查
        run: bash -n scripts/add_subtitles.sh

      - name: ShellCheck
        run: shellcheck -S warning scripts/add_subtitles.sh

      - name: 校验 SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md 缺少 YAML frontmatter")
          fm = m.group(1)
          name = re.search(r"^name:\s*(\S+)\s*$", fm, re.M)
          desc = re.search(r"^description:\s*(\S.*)$", fm, re.M)
          if not name or not desc:
              sys.exit("frontmatter 缺少 name 或 description")
          if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name.group(1)):
              sys.exit(f"name 不是合法 kebab-case: {name.group(1)}")
          if len(name.group(1)) > 64:
              sys.exit("name 超过 64 字符")
          if ": " in desc.group(1) or "<" in desc.group(1) or ">" in desc.group(1):
              sys.exit("description 含 :、< 或 >，会导致 YAML 解析问题")
          # 注意：这里校验的是 repo 根目录，仓库名（xxx-skill）本来就不等于 skill 名，
          # 安装时才要求「安装目录名 == name」，所以此处不做目录名断言
          body = text[m.end():].strip()
          if not body:
              sys.exit("SKILL.md 正文为空")
          print(f"OK: name={name.group(1)} | description {len(desc.group(1))} 字符")
          PY
